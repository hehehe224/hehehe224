    <circle cx="551" cy="287" r="18" fill="#08070B" stroke="#E44EDC" stroke-width="4"/><text x="512" y="336" fill="#FFF7FB" font-size="18" font-weight="700">CRAFT</text><text x="478" y="358" fill="#9D8996" font-size="13">sweat the final interaction</text>
