<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LENA</title>
  <desc id="desc">Custom geometric LENA wordmark with a neon-rose orbit</desc>

  <defs>
    <linearGradient id="rose" x1="132" y1="56" x2="1080" y2="304" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF2D95"/>
      <stop offset="0.55" stop-color="#D946EF"/>
      <stop offset="1" stop-color="#6A245F"/>
    </linearGradient>
    <radialGradient id="wash" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(995 170) rotate(180) scale(410 258)">
      <stop stop-color="#FF2D95" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#070609" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="360" fill="#070609"/>
  <rect width="1200" height="360" fill="url(#wash)"/>
  <rect x="25.5" y="25.5" width="1149" height="309" rx="2.5" fill="none" stroke="#3A2036"/>

  <ellipse cx="948" cy="178" rx="208" ry="76" transform="rotate(-13 948 178)" fill="none" stroke="url(#rose)" stroke-width="2"/>
  <ellipse cx="948" cy="178" rx="142" ry="142" transform="rotate(38 948 178)" fill="none" stroke="#FF2D95" stroke-opacity="0.16"/>
  <path d="M731 229C842 133 1001 98 1136 126" fill="none" stroke="#FFB1D5" stroke-opacity="0.22"/>
  <circle cx="1134" cy="126" r="5" fill="#FF2D95"/>
  <circle cx="792" cy="224" r="3" fill="#FFF4FA"/>

  <path d="M78 77H174" stroke="#FF2D95" stroke-width="3"/>

  <!-- Bespoke geometric wordmark: every letter is authored as a shape. -->
  <path d="M78 102H99V219H184V240H78V102Z" fill="#FFF8FC"/>
  <path d="M222 102H345V123H243V158H329V179H243V219H349V240H222V102Z" fill="#FFF8FC"/>
  <path d="M390 240V102H410L513 207V102H534V240H514L411 135V240H390Z" fill="#FFF8FC"/>
  <path fill-rule="evenodd" clip-rule="evenodd" d="M573 240L633 102H657L717 240H693L678 204H612L597 240H573ZM621 183H669L645 126L621 183Z" fill="#FFF8FC"/>

  <!-- Rose cuts make the mark identifiable at a glance. -->
